name: civicconnect_ai
description: CivicConnect AI - municipal complaints hackathon MVP starter.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.6.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  go_router: ^16.2.0
  shared_preferences: ^2.5.3
  image_picker: ^1.1.2
  geolocator: ^14.0.2
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  uuid: ^4.5.1
  supabase_flutter: ^2.9.1 # Future integration; NOT initialized yet
  flutter_svg: ^2.2.0
  flutter_local_notifications: ^19.4.1 # Future notifications
  # Add firebase_messaging only when FCM is configured.
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
